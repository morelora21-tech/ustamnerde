<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ustamnerde yönetim</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#ECEEF0;--card:#fff;--ink:#14202E;--mut:#5E6B7A;--line:#DCE0E5;--blue:#1E3F66;--yel:#F5B800;--ok:#1E8A5A;--bad:#C0392B}
@media(prefers-color-scheme:dark){:root{--bg:#0F1722;--card:#18232F;--ink:#EEF1F4;--mut:#9AA6B3;--line:#2A3745;--ok:#4CC38A;--bad:#FF7B6B}}
*{box-sizing:border-box}body{margin:0;font:15px/1.45 system-ui,'Segoe UI',sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit;color:inherit}
.btn{background:var(--yel);color:#14202E;border:0;border-radius:10px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.g{background:var(--bg);color:var(--ink);border:1px solid var(--line)}.btn.r{background:var(--bad);color:#fff}
:focus-visible{outline:3px solid var(--yel);outline-offset:2px}
input,select{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
#login{max-width:340px;margin:12vh auto;padding:24px;background:var(--card);border-radius:18px}
#login input{width:100%;margin:8px 0}
.err{color:var(--bad);min-height:22px;font-size:14px}
header{background:var(--blue);color:#fff;padding:12px 20px;display:flex;justify-content:space-between;align-items:center}
header b{font-size:18px}header span{color:var(--yel)}
.wrap{display:flex;min-height:calc(100vh - 50px)}
nav{width:190px;padding:14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;flex:none}
nav button{text-align:left;background:none;border:0;padding:10px 12px;border-radius:10px;cursor:pointer;color:var(--ink)}
nav button.on{background:var(--card);font-weight:700;box-shadow:inset 3px 0 var(--yel)}
main{flex:1;padding:20px;min-width:0}
h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.card{background:var(--card);border-radius:14px;padding:14px}
.big{font-size:28px;font-weight:800}.mut{color:var(--mut);font-size:13px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;margin-top:10px}
.bars div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}
.bars i{display:block;background:var(--blue);border-radius:5px 5px 0 0;min-height:2px;margin-bottom:3px}
@media(prefers-color-scheme:dark){.bars i{background:#7FA7D9}}
.tw{overflow-x:auto;background:var(--card);border-radius:14px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px}tr.k{cursor:pointer}tr.k:hover td{background:var(--bg)}
.tag{display:inline-block;border-radius:8px;padding:1px 8px;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.tag.b{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}.tag.n{background:var(--bg);color:var(--mut)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.mod{position:fixed;inset:0;background:rgba(10,18,28,.55);display:none;align-items:center;justify-content:center;padding:16px}.mod.show{display:flex}
.pan{background:var(--card);border-radius:18px;padding:20px;width:100%;max-width:560px;max-height:90vh;overflow:auto}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 10px;margin:12px 0;font-size:14px}.kv span:nth-child(odd){color:var(--mut)}
.msg{padding:8px 10px;border-radius:10px;margin:6px 0;background:var(--bg);display:flex;justify-content:space-between;gap:10px}
.msg.u{background:color-mix(in srgb,var(--yel) 22%,var(--card))}
.warn{background:color-mix(in srgb,var(--yel) 25%,var(--card));padding:8px 12px;border-radius:10px;font-size:13px;margin-bottom:10px}
@media(max-width:700px){.wrap{flex-direction:column}nav{width:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line)}}
</style></head><body>
<div id="login"><h2>usta<span style="color:var(--yel)">m</span>nerde yönetim</h2><p class="mut">Yönetici hesabınla giriş yap.</p>
<input id="le" type="email" placeholder="E-posta" aria-label="E-posta"><input id="lp" type="password" placeholder="Şifre" aria-label="Şifre"><div class="err" id="lerr" role="alert"></div><button class="btn" id="lgo" style="width:100%">Giriş yap</button><button class="btn g" id="lg" style="width:100%;margin-top:8px">Google ile giriş</button></div>
<div id="app" hidden>
<header><b>usta<span>m</span>nerde · yönetim</b><div><button class="btn g" id="bk">Yedek indir</button> <button class="btn g" id="out">Çıkış</button></div></header>
<div class="wrap"><nav id="nav"><button data-t="ozet" class="on">Özet</button><button data-t="users">Kullanıcılar</button><button data-t="convs">Konuşmalar</button><button data-t="log">İşlem kaydı</button></nav><main id="main"></main></div></div>
<div class="mod" id="mod"><div class="pan" id="pan"></div></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut,GoogleAuthProvider,signInWithPopup} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
const fa=getAuth(initializeApp({apiKey:"AIzaSyARXrrAl8pfd7uaIU6zkrB_XNrZdz45YgE",authDomain:"ustamnerede-1b25c.firebaseapp.com",projectId:"ustamnerede-1b25c",appId:"1:249815630502:web:73490244c4fe0847a9ea67"}));
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ls={g:k=>{try{return localStorage.getItem(k)}catch{}},s:(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch{}}};
const dt=t=>t?new Date(t).toLocaleString('tr-TR',{dateStyle:'short',timeStyle:'short'}):'—';
const CAT={elektrik:'Elektrik',su:'Su tesisatı',boya:'Boya & badana',klima:'Klima & kombi'};
let tab='ozet',F={q:'',role:'',status:'',page:1},cache={};
async function api(p,o={}){const tok=fa.currentUser?await fa.currentUser.getIdToken():'';const r=await fetch('/api'+p,{method:o.m||'GET',headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:o.b?JSON.stringify(o.b):undefined});
 if(o.raw){if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Hata');return r.blob()}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Hata');return j}
async function dl(p,name){try{const b=await api(p,{raw:1}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click()}catch(e){alert(e.message)}}
function signout(msg=''){$('#app').hidden=true;$('#login').hidden=false;$('#lerr').textContent=msg}
$('#lgo').onclick=login;$('#lp').onkeydown=e=>e.key==='Enter'&&login();
async function login(){$('#lerr').textContent='';try{await signInWithEmailAndPassword(fa,$('#le').value.trim(),$('#lp').value)}catch(e){signout('E-posta veya şifre hatalı')}}
$('#lg').onclick=async()=>{try{await signInWithPopup(fa,new GoogleAuthProvider())}catch(e){signout('Google girişi başarısız oldu')}};
async function boot(){try{await api('/admin/stats')}catch(e){return signout(e.message==='Profil tamamlanmamış'?'Bu hesap için önce uygulamadan (ana sayfadan) üye olup profilini oluştur.':e.message)}$('#login').hidden=true;$('#app').hidden=false;show()}
$('#out').onclick=()=>signOut(fa);$('#bk').onclick=()=>confirm('Tüm veritabanının yedeği indirilecek (şifre özetleri dahil). Güvenli bir yerde sakla.')&&dl('/admin/backup','ustamnerde-yedek.db');
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;tab=b.dataset.t;[...$('#nav').children].forEach(x=>x.classList.toggle('on',x===b));show()};
$('#mod').onclick=e=>{if(e.target.id==='mod')$('#mod').classList.remove('show')};
const show=()=>({ozet,users,convs,log})[tab]().catch(e=>{if(/Oturum/.test(e.message))signout();else $('#main').innerHTML='<p class="err">'+esc(e.message)+'</p>'});
const bars=(rows,key='d')=>{const days=[...Array(7)].map((_,i)=>new Date(Date.now()-(6-i)*864e5).toLocaleDateString('sv')),m=Object.fromEntries(rows.map(r=>[r.d,r.n])),mx=Math.max(1,...days.map(d=>m[d]||0));
 return '<div class="bars">'+days.map(d=>`<div>${m[d]||0}<i style="height:${(m[d]||0)/mx*70}px"></i>${d.slice(8)}.${d.slice(5,7)}</div>`).join('')+'</div>'};
const lst=(rows,f=x=>x)=>rows.length?rows.map(r=>`<div style="display:flex;justify-content:space-between;padding:4px 0"><span>${esc(f(r.k))}</span><b>${r.n}</b></div>`).join(''):'<p class="mut">Henüz veri yok.</p>';
async function ozet(){const s=await api('/admin/stats'),c=(n,t)=>`<div class="card"><div class="big">${n}</div><div class="mut">${t}</div></div>`;
 $('#main').innerHTML=`<h2>Özet</h2><div class="grid">${c(s.users,'Toplam kullanıcı')+c(s.ustas,'Usta')+c(s.musteri,'Müşteri')+c(s.unverified,'E-postası onaysız')+c(s.phoneOk,'Telefon onaylı')+c(s.banned,'Askıda hesap')+c(s.convs,'Konuşma')+c(s.msgs,'Mesaj')}</div>
 <div class="two"><div class="card"><b>Son 7 gün kayıt</b>${bars(s.signups)}</div><div class="card"><b>Son 7 gün mesaj</b>${bars(s.msgDays)}</div>
 <div class="card"><b>Şehre göre usta</b>${lst(s.cities)}</div><div class="card"><b>Mesleğe göre usta</b>${lst(s.cats,k=>CAT[k]||k||'—')}</div></div>`}
async function users(){const d=await api('/admin/users?'+new URLSearchParams(F));cache.u=Object.fromEntries(d.rows.map(u=>[u.id,u]));const pages=Math.max(1,Math.ceil(d.total/25));
 $('#main').innerHTML=`<h2>Kullanıcılar <span class="mut">(${d.total})</span></h2><div class="bar"><input id="fq" placeholder="Ad ya da e-posta ara" value="${esc(F.q)}" aria-label="Ara">
 <select id="fr" aria-label="Rol"><option value="">Tüm roller</option><option value="usta"${F.role==='usta'?' selected':''}>Usta</option><option value="musteri"${F.role==='musteri'?' selected':''}>Müşteri</option></select>
 <select id="fs" aria-label="Durum"><option value="">Tüm durumlar</option><option value="banned"${F.status==='banned'?' selected':''}>Askıda</option><option value="unverified"${F.status==='unverified'?' selected':''}>E-posta onaysız</option></select>
 <button class="btn" id="fgo">Ara</button><button class="btn g" id="csv">CSV indir</button></div>
 <div class="tw"><table><tr><th>#</th><th>Ad</th><th>E-posta</th><th>Rol</th><th>Şehir</th><th>Durum</th><th>Kayıt</th></tr>${d.rows.map(u=>`<tr class="k" data-u="${u.id}"><td>${u.id}</td><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td>${u.role==='usta'?'Usta · '+(CAT[u.cat]||''):'Müşteri'}</td><td>${esc(u.city)}</td><td>${u.banned?'<span class="tag b">Askıda</span>':u.emailVerified?'<span class="tag">Aktif</span>':'<span class="tag n">Onaysız</span>'}</td><td>${dt(u.created)}</td></tr>`).join('')||'<tr><td colspan="7" class="mut">Kullanıcı bulunamadı.</td></tr>'}</table></div>
 <div class="bar" style="margin-top:12px"><button class="btn g" id="pv"${F.page<=1?' disabled':''}>←</button><span class="mut">Sayfa ${F.page} / ${pages}</span><button class="btn g" id="nx"${F.page>=pages?' disabled':''}>→</button></div>`;
 const go=()=>{F.q=$('#fq').value;F.role=$('#fr').value;F.status=$('#fs').value;F.page=1;users()};$('#fgo').onclick=go;$('#fq').onkeydown=e=>e.key==='Enter'&&go();
 $('#pv').onclick=()=>{F.page--;users()};$('#nx').onclick=()=>{F.page++;users()};$('#csv').onclick=()=>dl('/admin/export.csv','kullanicilar.csv');
 document.querySelectorAll('tr.k').forEach(r=>r.onclick=()=>detail(r.dataset.u))}
const modal=h=>{$('#pan').innerHTML=h;$('#mod').classList.add('show')},close=()=>$('#mod').classList.remove('show');
function detail(id){const u=cache.u[id];modal(`<h2>${esc(u.name)}</h2><div class="kv"><span>E-posta</span><span>${esc(u.email)} ${u.emailVerified?'<span class="tag">onaylı</span>':'<span class="tag n">onaysız</span>'}</span>
 <span>Telefon</span><span>${esc(u.phone)||'—'} ${u.phoneVerified?'<span class="tag">onaylı</span>':''}</span><span>Rol</span><span>${u.role==='usta'?'Usta · '+(CAT[u.cat]||''):'Müşteri'}</span><span>Şehir</span><span>${esc(u.city)}${u.district?' / '+esc(u.district):''}</span>
 <span>Kayıt</span><span>${dt(u.created)}${u.google?' · Google ile':''}</span><span>Gönderdiği mesaj</span><span>${u.mc}</span>${u.role==='usta'?`<span>Ücret</span><span>${u.price?u.price+' ₺':'—'}</span><span>Açıklama</span><span style="white-space:normal">${esc(u.bio)||'—'}</span>`:''}
 ${u.banned?`<span>Askı nedeni</span><span class="err" style="min-height:0">${esc(u.reason)||'—'}</span>`:''}</div>
 <div class="bar"><button class="btn ${u.banned?'':'r'}" id="d_ban">${u.banned?'Askıyı kaldır':'Hesabı askıya al'}</button>${u.emailVerified?'':'<button class="btn g" id="d_ver">E-postayı onayla</button>'}<button class="btn g" id="d_del" style="color:var(--bad)">Hesabı sil</button><button class="btn g" id="d_x">Kapat</button></div>`);
 const act=async(f,msg)=>{try{await f();close();users()}catch(e){alert(e.message)}};$('#d_x').onclick=close;
 $('#d_ban').onclick=()=>{let r='';if(!u.banned){r=prompt('Askıya alma nedeni:');if(r===null)return}act(()=>api(`/admin/users/${id}/ban`,{m:'POST',b:{banned:!u.banned,reason:r}}))};
 $('#d_ver')&&($('#d_ver').onclick=()=>act(()=>api(`/admin/users/${id}/verify`,{m:'POST'})));
 $('#d_del').onclick=()=>confirm(`${u.name} hesabı ve tüm mesajları KALICI olarak silinecek. Emin misin?`)&&act(()=>api('/admin/users/'+id,{m:'DELETE'}))}
async function convs(){const r=await api('/admin/convs');
 $('#main').innerHTML=`<h2>Konuşmalar</h2><div class="warn">Mesaj içeriğini açman işlem kaydına yazılır. Sadece şikâyet, güvenlik ve destek için aç.</div><div class="tw"><table><tr><th>#</th><th>Müşteri</th><th>Usta</th><th>Mesaj</th><th>Son mesaj</th></tr>${r.map(c=>`<tr class="k" data-c="${c.id}"><td>${c.id}</td><td>${esc(c.cn)}<div class="mut">${esc(c.ce)}</div></td><td>${esc(c.un)}<div class="mut">${esc(c.ue)}</div></td><td>${c.n}</td><td>${dt(c.last)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Henüz konuşma yok.</td></tr>'}</table></div>`;
 document.querySelectorAll('tr.k').forEach(r=>r.onclick=()=>thread(r.dataset.c))}
async function thread(id){try{const m=await api('/admin/convs/'+id);modal(`<h2>Konuşma #${id}</h2>${m.map(x=>`<div class="msg ${x.who==='usta'?'u':''}"><span><b>${x.who==='usta'?'Usta':'Müşteri'}</b> · ${dt(x.ts)}<br>${esc(x.text)}</span><button class="btn g" data-m="${x.id}">Sil</button></div>`).join('')||'<p class="mut">Mesaj yok.</p>'}<div class="bar"><button class="btn g" id="d_x">Kapat</button></div>`);
 $('#d_x').onclick=close;$('#pan').querySelectorAll('[data-m]').forEach(b=>b.onclick=async()=>{if(!confirm('Bu mesaj silinsin mi?'))return;try{await api('/admin/msgs/'+b.dataset.m,{m:'DELETE'});thread(id)}catch(e){alert(e.message)}})}catch(e){alert(e.message)}}
async function log(){const r=await api('/admin/log');$('#main').innerHTML=`<h2>İşlem kaydı</h2><div class="tw"><table><tr><th>Zaman</th><th>Yönetici</th><th>İşlem</th><th>Hedef</th><th>Not</th></tr>${r.map(l=>`<tr><td>${dt(l.ts)}</td><td>${esc(l.admin)}</td><td>${esc(l.action)}</td><td>${esc(l.target)}</td><td style="white-space:normal">${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="5" class="mut">Kayıt yok.</td></tr>'}</table></div>`}
onAuthStateChanged(fa,u=>u?boot():signout());
</script></body></html>
